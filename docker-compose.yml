services:
  db:
    image: postgres:16-alpine
    container_name: racha-db
    environment:
      POSTGRES_DB: racha
      POSTGRES_USER: racha
      POSTGRES_PASSWORD: racha_dev_password   # local development only
    ports:
      - "5432:5432"
    volumes:
      - racha-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racha -d racha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  racha-data:
